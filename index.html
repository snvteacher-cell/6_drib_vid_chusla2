:root{color-scheme:light;
  --paper:#fff;--bg:#eef4fa;--line:#cfd5ee;--frame:#26324a;--text:#1d2433;--muted:#5f6b7d;--ink:#1c40a6;

  --berry:#8b5cf6;--berrybg:#efe9fe;--sun:#ffb020;--sunbg:#fff6df;--cream:#f2f4ff;--sky:#2f86d6;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--f-head:"Unbounded","Golos Text",system-ui,sans-serif}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:18px;line-height:1.4;-webkit-tap-highlight-color:transparent}
.app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;position:relative;overflow:hidden;
  background-image:linear-gradient(#e4ecf4 1px,transparent 1px),linear-gradient(90deg,#e4ecf4 1px,transparent 1px);background-size:24px 24px}
.flags{height:22px;flex:none;background:radial-gradient(circle at 20% 40%,#ffd75e 1.6px,transparent 2.4px) 0 0/46px 22px,radial-gradient(circle at 70% 70%,#fff 1.2px,transparent 2px) 0 0/30px 22px,linear-gradient(90deg,#1b1f5e,#3b2f8f,#1b1f5e)}
.flame{animation:flame .25s ease-in-out infinite alternate;transform-origin:60px 118px}@keyframes flame{to{transform:scaleY(.7)}}
#main input+input{margin-top:-6px}
#sendSt{font-size:16px;text-align:center}
header{display:flex;align-items:center;gap:10px;padding:8px 16px 6px;background:linear-gradient(#1b1f5e,#2a2775);color:#fff}
header .t{font-size:13px;color:#c9cff5;letter-spacing:.06em;text-transform:uppercase;flex:1}
.track{position:relative;background:#2a2775;padding:6px 44px 14px 16px;border-radius:0 0 22px 22px}
.bar{height:8px;border-radius:4px;background:#3b3f8f;overflow:hidden;background-image:radial-gradient(circle,#6a70c8 1.5px,transparent 2px);background-size:12px 8px}
.track .rk{position:absolute;top:-4px;width:26px;height:26px;transform:translateX(-50%) rotate(90deg);transition:left .6s}
.track .goal{position:absolute;right:12px;top:-1px;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffd0a8,#ff8a5c 60%,#c2502e);box-shadow:0 0 10px #ff8a5c}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--sun),var(--berry));border-radius:5px;transition:width .5s}
.coins{display:flex;align-items:center;gap:4px;font-weight:700;color:#ffd36b}
.icon[disabled]{opacity:.35;cursor:default}
.icon{font:inherit;border:2px solid #4a4fa8;background:#3b3f8f;color:#fff;border-radius:12px;width:40px;height:40px;font-size:18px;cursor:pointer;flex:none}
main{flex:1;padding:12px 16px 24px;display:flex;flex-direction:column;gap:12px}
h1,h2{font-family:var(--f-head);font-weight:600;margin:0;color:var(--main2);text-wrap:balance}
h1{font-size:28px;line-height:1.2}h2{font-size:20px;line-height:1.3}
p{margin:0}
.card{background:radial-gradient(circle at 85% 10%,#4b3fa8,transparent 55%),linear-gradient(160deg,#1b1f5e,#2d2a8f);color:#fff;border:0;border-radius:20px;padding:12px 14px;display:flex;gap:10px;align-items:center;box-shadow:0 6px 16px rgba(27,31,94,.25)}
.card b{color:#ffd36b}
.kart{flex:none;border-radius:14px}
.tw{animation:tw 2.4s ease-in-out infinite}.tw1{animation-delay:.8s}.tw2{animation-delay:1.6s}@keyframes tw{50%{opacity:.25}}
.hero{position:relative;align-self:center;width:190px;height:190px;border-radius:50%;background:radial-gradient(circle at 70% 25%,#4b3fa8,transparent 50%),linear-gradient(160deg,#1b1f5e,#2d2a8f);border:6px solid #c9cff5;box-shadow:0 0 0 6px #8b5cf6,0 10px 24px rgba(27,31,94,.3);display:grid;place-items:center;overflow:hidden}
.hero .pl{position:absolute;border-radius:50%}
.hero svg.sky{position:absolute;inset:0;width:100%;height:100%}
.card svg{flex:none}
.q{font-size:18px}
.steps{display:flex;flex-direction:column;gap:10px}
.step{background:#fff;border:2px solid var(--line);border-radius:16px;padding:8px 12px;transition:border-color .2s,background .2s}
.step .lb{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.step .m{font-size:24px;line-height:2;overflow-x:auto;overflow-y:hidden;white-space:nowrap;padding:.3em 0}
.step.cur{border-color:var(--berry);box-shadow:0 0 0 4px rgba(224,71,91,.12)}
.step.done{border-color:var(--ok);background:var(--okbg)}
.step.todo{opacity:.45}
.hint{font-size:16px;background:var(--sunbg);border-radius:12px;padding:8px 12px;margin-top:6px;animation:pop .35s}
.hint.bad{background:var(--redbg)}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;line-height:1.1;font-variant-numeric:tabular-nums}
.fr>span{padding:0 .14em;white-space:nowrap}
.fr>span+span{border-top:.07em solid currentColor;margin-top:.05em;padding-top:.05em}
.mx{display:inline-flex;align-items:center;white-space:nowrap;vertical-align:middle}
.mx>.w{font-size:1.5em;line-height:1;margin-right:.04em}
.cx{position:relative;display:inline-block}.cx s{text-decoration:none;position:relative}
.cx s::after{content:"";position:absolute;left:-.1em;right:-.1em;top:52%;border-top:.09em solid var(--red);transform:rotate(-28deg)}
.cx b{position:absolute;left:50%;transform:translateX(-50%);top:-.75em;font-size:.6em;line-height:1;color:var(--red)}
.fr>span+span .cx b{top:auto;bottom:-.78em}
.fr.k>span:first-child{padding-top:.5em}.fr.k>span+span{padding-bottom:.5em}
.nw{white-space:nowrap}
.bx{font:inherit;display:inline-grid;place-items:center;min-width:1.5em;height:1.15em;padding:0 .1em;border:2.5px dashed var(--ink);border-radius:9px;background:#fff;color:var(--ink);font-weight:700;font-size:.92em;line-height:1;vertical-align:middle;cursor:pointer}
.bx.w{min-width:1.15em;height:1.5em}
.bx.sel{border-style:solid;border-color:var(--berry);background:var(--berrybg)}

.sgn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}.sgn.bad{background:var(--redbg);border-color:var(--red);animation:shake .4s}
.scl{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:21px}
.pad{flex:none;position:sticky;bottom:0;background:rgba(255,255,255,.97);border-top:2px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(6,1fr);gap:6px;z-index:3}

.pad .k:active{background:var(--sun)}

.pad .k.wide{grid-column:span 3;font-size:19px;background:#fff}

.author{position:absolute;left:12px;bottom:4px;font-size:11px;color:#b4bfcc;pointer-events:none;z-index:4}
.start{align-items:center;text-align:center;justify-content:center;gap:16px}

#fx{position:fixed;inset:0;pointer-events:none;z-index:9;overflow:hidden}
.cf{position:absolute;top:55%;width:12px;height:16px;border-radius:3px;animation:cf 1.6s cubic-bezier(.2,.6,.4,1) forwards}
@keyframes cf{0%{transform:translate(0,0)}40%{transform:translate(calc(var(--dx)*.6),var(--dy)) rotate(calc(var(--r)*.5))}100%{transform:translate(var(--dx),420px) rotate(var(--r));opacity:0}}
.float{animation:float 3.5s ease-in-out infinite alternate}@keyframes float{to{transform:translateY(-10px)}}
.coinfall{animation:coinfall 2.4s ease-in infinite;transform-box:fill-box}.coinfall.d2{animation-delay:.8s}.coinfall.d3{animation-delay:1.6s}
@keyframes coinfall{0%{transform:translateY(-120px);opacity:0}15%{opacity:1}70%{transform:translateY(0) rotate(360deg);opacity:1}80%,100%{transform:translateY(8px) scale(.4);opacity:0}}
.bob{animation:bob 1.4s ease-in-out infinite alternate;transform-box:fill-box}@keyframes bob{to{transform:translateY(-8px)}}
.cup{animation:none}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

<script>

function gcd(a,b){a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b]}return a}
function fr(n,d,k){return`<span class="fr${k?" k":""}"><span>${n}</span><span>${d}</span></span>`}
function nw(s){return`<span class="nw">${s}</span>`}
// a number is [whole, numerator, denominator]: a fraction [0,n,d], a natural number [k,0,1], a mixed number [w,n,d]
const kind=([w,n,d])=>n===0?"nat":(w===0?"frac":"mixed");
const imp=([w,n,d])=>[w*d+n,d];
function mixH([w,n,d]){if(!n)return String(w);return w?`<span class="mx"><span class="w">${w}</span>${fr(n,d)}</span>`:fr(n,d)}
function toMix(p,q){const g=gcd(p,q)||1;p/=g;q/=g;return q===1?[p,0,1]:[Math.floor(p/q),p%q,q]}
const cx=(o,v)=>o===v?String(o):`<span class="cx"><s>${o}</s><b>${v}</b></span>`;
function prodH(N0,N,D0,D){const cut=N0.some((o,i)=>o!==N[i])||D0.some((o,i)=>o!==D[i]);
  return fr(N0.map((o,i)=>cx(o,N[i])).join(" · "),D0.map((o,i)=>cx(o,D[i])).join(" · "),cut)}
// cancel numerators against denominators, cross pairs first
function cancel(N,D){const cuts=[];
  for(const[i,j]of[[0,1],[1,0],[0,0],[1,1]]){const g=gcd(N[i],D[j]);if(g>1&&D[j]>1){cuts.push({i,j,g,n:N[i],d:D[j]});N[i]/=g;D[j]/=g}}
  return cuts}
const F=(n,d)=>[0,n,d],Nat=k=>[k,0,1];
// "дріб f від числа x": t={x:[w,n,d], f:[0,a,b]}. Written as in the textbook: 30 · 5/6 = (30·5)/(1·6) = 25
function ofSolve(t){
  const X=imp(t.x),a=t.f[1],b=t.f[2],steps=[],links=[],vals=[],ex=[X[0]*a,X[1]*b];
  const L=(h,v)=>{links.push(h);vals.push(v)};
  L(`${mixH(t.x)} · ${fr(a,b)}`,ex);
  if(kind(t.x)==="mixed"){steps.push(`мішане число → неправильний дріб: ${nw(`${mixH(t.x)} = ${fr(X[0],X[1])}`)}`);L(`${fr(X[0],X[1])} · ${fr(a,b)}`,ex)}
  const N0=[X[0],a],D0=[X[1],b],N=[...N0],D=[...D0],cuts=cancel(N,D),P=N[0]*N[1],Q=D[0]*D[1];
  L(prodH(N0,N,D0,D),[P,Q]);
  L(Q===1?String(P):fr(P,Q),[P,Q]);
  const res=toMix(P,Q);
  if(Q>1&&P>Q)L(mixH(res),[P,Q]);
  return{steps,links,vals,ex,cuts,N0,D0,N,D,P,Q,X,res,chain:links.map(nw).join(" = "),ans:mixH(res)};
}

    <h1 style="text-align:center">Знаходження дробу від числа</h1>
    <p style="text-align:center" class="note">6 клас · тренажер «Космічна подорож» · ${MAX} завдань</p>
    <div class="theory"><b>Щоб знайти дріб від числа, треба дане число помножити на цей дріб.</b><p class="m">${taskHtml({x:Nat(K_STORY.n),f:F(K_STORY.a,K_STORY.d)})}:&nbsp; ${s0.chain}</p></div>
    <input id="nm" placeholder="Прізвище та ім’я" autocomplete="name" value="${(S.name||"").replace(/"/g,"&quot;")}" style="align-self:center">
    <input id="cl" placeholder="Клас, напр. 6-А" value="${(S.cls||"").replace(/"/g,"&quot;")}" style="align-self:center">
    <button class="btn" id="go" type="button" style="align-self:center">${S.i>=0&&S.i<MAX&&nDone()?"Продовжити":"Почати"}</button>
    ${nDone()?`<button class="btn ghost" id="again" type="button" style="align-self:center">Почати спочатку</button>`:""}
    <p class="note" style="text-align:center">Розв’язуй у зошиті, а відповіді вводь тут. За кожне завдання без помилок — зірочка!${MAIL_TO?" Коли розв’яжеш усе, результат сам надійде вчителю.":""}</p>`;
  $("#go").onclick=()=>{const nm=$("#nm").value.trim();if(!nm){$("#nm").focus();$("#nm").placeholder="Спершу впиши прізвище та ім’я";return}S.name=nm;S.cls=$("#cl").value.trim();if(!S.t0)S.t0=Date.now();if(S.i<0)S.i=0;if(S.i>=MAX)S={...fresh(S.name,S.cls),i:0,t0:Date.now()};S.step=0;S.tries=0;S.failed=false;S.taskWrong=0;save();ac();SFX.pop();show()};
  if($("#again"))$("#again").onclick=()=>{S={...fresh($("#nm").value.trim(),$("#cl").value.trim()),i:0,t0:Date.now()};save();ac();show()}}
function show(){$("#main").dataset.mode="task";hud();if(S.i>=MAX)return finish();const T=TASKS[S.i];cur=T;const was=S.solved[S.i];if(was!==undefined)S.step=(T.steps||T.scales).length;$("#hdr").textContent=`Завдання ${S.i+1} з ${MAX} · ${T.title}`;

  const body={_subject:`Дріб від числа (Космос): ${S.name}${S.cls?", "+S.cls:""}: ${n} з ${MAX}`,_template:"table",_captcha:"false",
